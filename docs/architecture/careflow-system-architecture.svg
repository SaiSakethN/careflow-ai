<text x="100" y="685" class="detail">scikit-learn Pipeline · XGBoost classifier</text>
<rect x="580" y="596" width="440" height="140" rx="15" class="box"/>
<text x="600" y="630" class="heading">VALIDATION  ·  2,128 visits / 28 hospitals</text>
<text x="600" y="660" class="detail">06  ROC-AUC 0.8375 · PR-AUC 0.3952</text>
<text x="600" y="685" class="detail">Precision 0.3333 · Recall 0.6723 · F1 0.4457</text>
<rect x="1080" y="596" width="440" height="140" rx="15" class="box"/>
<text x="1100" y="630" class="heading">TEST  ·  2,401 visits / 29 hospitals</text>
