<rect x="80" y="1260" width="440" height="140" rx="15" class="box"/>
<text x="100" y="1294" class="heading">11  Backend verification</text>
<text x="100" y="1324" class="detail">pytest · FastAPI TestClient</text>
<text x="100" y="1349" class="detail">19 passing tests (latest verified)</text>
<text x="100" y="1374" class="detail">Data, features, API behavior</text>
<rect x="580" y="1260" width="440" height="140" rx="15" class="box"/>
<text x="600" y="1294" class="heading">12  Frontend verification</text>
<text x="600" y="1324" class="detail">TypeScript compiler · Vite production build</text>
<text x="600" y="1349" class="detail">Local UI and prediction form verified</text>
<text x="600" y="1374" class="detail">Frontend / backend run separately</text>
<rect x="1080" y="1260" width="440" height="140" rx="15" class="box"/>
<text x="1100" y="1294" class="heading">13  Source &amp; delivery</text>
<text x="1100" y="1324" class="detail">Git · GitHub · documented setup</text>
<text x="1100" y="1349" class="detail">Public deployment PLANNED</text>
<text x="1100" y="1374" class="detail">No verified CI/CD or Docker deployment</text>
<rect x="80" y="1455" width="1440" height="150" rx="15" class="accent"/>
<text x="100" y="1489" class="heading">RESEARCH-ONLY SAFETY BOUNDARY</text>
<text x="100" y="1519" class="detail">Retrospective observational survey data · not clinically validated · no prospective testing</text>
<text x="100" y="1544" class="detail">No individual clinical-risk interpretation · no medical decisions · do not enter real patient information</text>
<text x="80" y="1660" class="sub">Solid arrows show implemented data/model/application flow. Held-out evaluation and public hosting remain pending.</text>
<text x="80" y="1695" class="tiny">CareFlow AI · Architecture reflects the verified local implementation, not a production clinical system.</text>
