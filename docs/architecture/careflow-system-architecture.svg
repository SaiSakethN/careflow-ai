<rect width="1600" height="1760" fill="#091725"/>
<text x="80" y="85" class="title">CareFlow AI  |  End-to-End System Architecture</text>
<text x="80" y="122" class="sub">CDC NHAMCS 2022 • Hospital-disjoint ML research • FastAPI + React • Verified local MVP</text>
<line x1="80" y1="148" x2="1520" y2="148" stroke="#375267" stroke-width="2"/>

<text x="80" y="194" class="section">A  /  DATA &amp; FEATURE PIPELINE</text>
