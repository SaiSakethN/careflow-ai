<text x="600" y="252" class="heading">02  Ingestion &amp; audit</text>
<text x="600" y="282" class="detail">Python · pandas · pyreadstat</text>
<text x="600" y="307" class="detail">SAS parsing, missingness, schema checks</text>
<rect x="1080" y="218" width="440" height="125" rx="15" class="box"/>
