<text x="100" y="464" class="heading">04  Hospital-grouped split</text>
<text x="100" y="494" class="detail">scikit-learn GroupShuffleSplit · HOSPCODE grouping · random_state=42</text>
<text x="100" y="519" class="detail">Mutually exclusive hospitals across train / validation / held-out test</text>
<path d="M320,545 L320,591" class="line"/>
<path d="M800,545 L800,591" class="line"/>
<path d="M1280,545 L1280,591" class="line"/>
