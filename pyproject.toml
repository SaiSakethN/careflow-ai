[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow-ai"
version = "0.1.0"
description = "Emergency Department Admission Prediction and Patient Flow Analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyreadstat>=1.2,<2",
    "scikit-learn>=1.5,<2",
    "shap>=0.46,<1",
    "matplotlib>=3.8,<4",
    "joblib>=1.5,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "xgboost>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]